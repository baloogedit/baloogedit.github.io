<style>
  /* 
   * 1. TISZTA KÓD: CSS Változók (Custom Properties) definiálása 
   * Ez megkönnyíti a színek, méretek egy helyről történő módosítását.
   */
  :root {
    --light-sq: #f0d9b5; /* Világos (bézs) mező */
    --dark-sq: #b58863;  /* Sötét (barna) mező */
    --hover-sq: rgba(255, 255, 255, 0.4); /* Kiemelés színe */
    --border-color: #2c1b18; 
    --label-color: #333;
    /* Reszponzív méret: minimum 30px, ideálisan a képernyőszélesség 8%-a, max 80px */
    --cell-size: clamp(30px, 8vw, 80px); 
  }

  /* 
   * 2. MAGAS KONTRASZT MÓD (Accessibility / Pluszpont)
   * Ha a felhasználó operációs rendszere magas kontrasztot kér,
   * a változók értékei fekete-fehérre cserélődnek.
   */
  @media (prefers-contrast: more) {
    :root {
      --light-sq: #ffffff;
      --dark-sq: #000000;
      --hover-sq: #ffff00; /* Erős sárga fókusz/hover */
      --border-color: #000000;
      --label-color: #000000;
    }
  }

  /* 
   * 3. SAKKTÁBLA ALAPBEÁLLÍTÁSAI ÉS ÁRNYÉKOLÁS (Kreatív pluszpont) 
   */
  #sakktabla {
    /* Számláló inicializálása a sorok számozásához (8-tól indul lefelé) */
    counter-reset: row-counter 9; 
    
    border: 8px solid var(--border-color);
    border-collapse: collapse;
    margin: 60px auto; /* Hely a címkéknek */
    
    /* 3D hatású asztal-árnyék */
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 
                0 5px 15px rgba(0, 0, 0, 0.2);
    position: relative; /* Fontos a címkék pozicionálásához */
    background-color: var(--border-color); /* Rés-szín fallback */
  }

  /* Soronként csökkentjük a számlálót 1-el */
  #sakktabla tr {
    counter-increment: row-counter -1;
  }

  /* 
   * 4. MEZŐK (CELLÁK) STÍLUSOZÁSA 
   */
  #sakktabla td {
    width: var(--cell-size);
    height: var(--cell-size);
    background-color: var(--light-sq);
    position: relative;
    /* Lágy 3D belső árnyék minden mezőn */
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.15);
    /* Animáció előkészítése az átmenetekhez */
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* Sötét mezők kiválasztása (az eredeti, tökéletes logika alapján) */
  #sakktabla tr:nth-child(odd) td:nth-child(even),
  #sakktabla tr:nth-child(even) td:nth-child(odd) {
    background-color: var(--dark-sq);
  }

  /* 
   * 5. HOVER ÉS FÓKUSZ ÁLLAPOTOK (Pluszpont)
   * Kiemelés belső kerettel és árnyék-mélyítéssel, 
   * ami nem rontja el a táblázat (border-collapse) elrendezését.
   */
  #sakktabla td:hover,
  #sakktabla td:focus-within {
    box-shadow: inset 0 0 0 4px var(--hover-sq), 
                inset 0 0 20px rgba(0,0,0,0.5);
    cursor: pointer;
    /* Finom emelkedő effektus */
    transform: scale(1.05);
    z-index: 10;
    border-radius: 4px;
  }

  /* 
   * 6. CÍMKÉK AZ ÉLEK MENTÉN (HTML módosítás nélküli kreatív trükk) 
   */
  
  /* BAL OLDALI SZÁMOZÁS (1-8) - ::before pszeudo-elemmel és CSS számlálóval */
  #sakktabla td:first-child::before {
    content: counter(row-counter);
    position: absolute;
    left: -35px; /* Kilógatjuk a tábláról */
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Arial', sans-serif;
    font-weight: bold;
    font-size: calc(var(--cell-size) * 0.4); /* Reszponzív betűméret */
    color: var(--label-color);
    pointer-events: none; /* Ne zavarjon a hover-ben */
  }

  /* ALSÓ BETŰZÉS (A-H) - A legalsó sor celláinak ::after elemével */
  #sakktabla tr:last-child td::after {
    position: absolute;
    bottom: -40px; /* Kilógatjuk a tábláról alulra */
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Arial', sans-serif;
    font-weight: bold;
    font-size: calc(var(--cell-size) * 0.4);
    color: var(--label-color);
    pointer-events: none;
  }

  /* Mivel nincs CSS betű-számláló, egyenként adjuk meg a betűket az oszlopokhoz */
  #sakktabla tr:last-child td:nth-child(1)::after { content: 'A'; }
  #sakktabla tr:last-child td:nth-child(2)::after { content: 'B'; }
  #sakktabla tr:last-child td:nth-child(3)::after { content: 'C'; }
  #sakktabla tr:last-child td:nth-child(4)::after { content: 'D'; }
  #sakktabla tr:last-child td:nth-child(5)::after { content: 'E'; }
  #sakktabla tr:last-child td:nth-child(6)::after { content: 'F'; }
  #sakktabla tr:last-child td:nth-child(7)::after { content: 'G'; }
  #sakktabla tr:last-child td:nth-child(8)::after { content: 'H'; }

</style>
